# Local Postgres for development. Chroma runs embedded inside the backend
# (CHROMA_MODE=embedded), so it needs no container.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phia}
      POSTGRES_DB: ${POSTGRES_DB:-phia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phia}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
