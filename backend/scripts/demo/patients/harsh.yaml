# Harsh: a recurring pattern and the visit loop (ROADMAP.md Phase 7).
# Fictional patient. All dates are "days ago" from the day the replay runs, so the data is
# always fresh on demo day. Times are IST.

key: harsh
login: {email: harsh@demo.phia, password: demo-harsh-123}
patient: {name: Harsh Iyer, age: 52, sex: M, height: 172, weight: 82, blood_group: B+}
background:
  conditions: ["Type 2 diabetes (diagnosed 2018)"]
  allergies: []
  family_history: ["Father: type 2 diabetes"]
  surgical_history: []
  lifestyle: {smoking: false, alcohol: occasional, exercise: "evening walks, irregular",
              work: "software manager in Bengaluru, long meeting days"}

doctors:
  - {name: Dr. Rao, specialty: Endocrinology}

medicines:
  - {name: Metformin, dose: 500 mg, frequency: twice daily, dose_times: ["08:00", "20:00"],
     purpose: Blood sugar, prescriber: Dr. Rao, specialty: Endocrinology, started_days_ago: 2900}
  - {name: Glimepiride, dose: 1 mg, frequency: once daily before breakfast, dose_times: ["08:00"],
     purpose: Blood sugar, prescriber: Dr. Rao, specialty: Endocrinology, started_days_ago: 420}

medication_changes:
  - {medicine: Glimepiride, days_ago: 150, dose: 2 mg, note: "Raised at the visit after HbA1c 8.4"}

history_days: 240          # how far back the logs and readings go
adherence: {rate: 0.93, seed: 7}   # share of scheduled doses marked taken

readings:
  fasting_glucose: {every_days: 3, time: "07:30", start: 168, end: 122, noise: 8}
  bp: {every_days: 21, time: "08:15", systolic: [131, 126], diastolic: [85, 80], noise: 3}
  weight: {every_days: 30, time: "07:10", start: 82.6, end: 80.4, noise: 0.4}

lab: {name: Nimbus Diagnostics (fictional), address: "100 Ft Road, Bengaluru 560038"}
reports:   # HbA1c 8.4 -> 7.6 -> 6.9
  - {days_ago: 230, hba1c: 8.4, fasting_glucose: 171}
  - {days_ago: 140, hba1c: 7.6, fasting_glucose: 152}
  - {days_ago: 40, hba1c: 6.9, fasting_glucose: 128}

# The planted pattern: each on a day he skipped lunch after his morning glimepiride; two with
# low readings; all after the dose increase (150 days ago).
episodes:
  - days_ago: 120
    lunch: {time: "13:20", text: "skipped lunch today, back to back meetings till 3"}
    episode: {time: "15:05", text: "felt shaky and sweaty around 3pm, a bit dizzy and heart racing. a biscuit helped"}
    glucose: {time: "15:12", value: 62}
  - days_ago: 90
    lunch: {time: "13:35", text: "missed lunch, release call ran long"}
    episode: {time: "15:30", text: "shaky and sweaty again in the afternoon, dizzy, heart pounding. settled after some juice"}
    glucose: {time: "15:38", value: 66}
  - days_ago: 45
    lunch: {time: "13:10", text: "no lunch today, travelling between client offices"}
    episode: {time: "15:15", text: "shaky, sweaty and dizzy mid afternoon, heart racing. ate something and it passed"}

