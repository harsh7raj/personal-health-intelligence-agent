# Doctor visits: used by Phase 3 (visit recaps). Kept here so the story is in one place.
visits:
  - days_ago: 151
    doctor: Dr. Rao
    specialty: Endocrinology
    recap: >-
      Dr. Rao said my HbA1c of 8.4 is still high, so she increased glimepiride from 1 mg to 2 mg
      before breakfast. She said not to skip meals after taking it, to watch for low sugars like
      shaking, sweating or dizziness, and if that happens to check my sugar and take something
      sweet like glucose or juice. Review in three months with a new HbA1c.

# What we type live in the demo, and what a good reply does.
live:
  - message: "feeling shaky and sweaty, skipped lunch, meetings all day"
    expect: [recalls the three earlier dates, shared skipped-lunch and morning-dose pattern,
             episodes began after the glimepiride increase, quotes Dr. Rao (needs Phase 3),
             asks him to check and log his sugar, suggests raising it at the next visit]
  - message: "how have my sugars been since the dose change?"
  - message: "Saw Dr. Rao today, she reduced glimepiride back to 1 mg because of the lows, asked me to keep a sugar diary, review in 6 weeks."
    expect: [visit recap flow (Phase 3)]
